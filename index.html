<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BFS Habelec — Évaluation NF C18-510</title>
<meta name="theme-color" content="#f3ab12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="ecran"></div>
<div id="toasts"></div>
<div id="debug-panel" hidden></div>

<!-- Bibliothèques externes (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- Application (ordre de chargement important) -->
<script src="HE_config.js"></script>
<script src="HE_debug.js"></script>
<script src="HE_core.js"></script>
<script src="HE_offline.js"></script>
<script src="HE_qcm.js"></script>
<script src="HE_msp_ressources.js"></script>
<script src="HE_pratique.js"></script>
<script src="HE_pdf.js"></script>
<script src="HE_app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => { HorsLigne.init(); demarrer(); });

// Mode hors-ligne (2026-08) : permet à l'appli de se recharger sans réseau
// (écran pratique déjà mis en cache — voir HE_offline.js). scope: './'
// obligatoire — plusieurs applis BFS partagent le même domaine GitHub Pages,
// un service worker à la racine prendrait le contrôle des autres.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { scope: './' })
      .catch(err => console.warn('Service worker non installé :', err));
  });
}
</script>

</body>
</html>
